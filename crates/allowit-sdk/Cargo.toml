[package]
name = "allowit-sdk"
version.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Shared rail execution and owner workflows, with no terminal I/O"

[features]
default = ["stellar"]
stellar = ["dep:allowit-stellar-wallet"]

[dependencies]
allowit = { workspace = true }
allowit-core = { workspace = true, features = ["std", "policy-source", "client", "transport", "vendor"] }
allowit-stellar-wallet = { workspace = true, optional = true }
getrandom = "0.3"
libc = "0.2.190"
serde = { version = "1.0.219", features = ["derive"] }
serde_json_canonicalizer = "0.3"
serde_json = { version = "1.0.143", features = ["raw_value", "arbitrary_precision"] }
zeroize = "1.8.2"
tempfile = "3.27"

chrono = { version = "0.4", default-features = false, features = ["std"] }
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

[dev-dependencies]
allowit-stellar-wallet = { workspace = true, features = ["test-support"] }

[[test]]
name = "stellar_owner_generation"
required-features = ["stellar"]

[[test]]
name = "generation_capabilities"
required-features = ["stellar"]
