[package]
name = "allowit-sdk"
version.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Shared rail execution and owner workflows, with no terminal I/O"

[features]
# Vendor-neutral test harness for shared tests here and in downstream repositories.
testkit = []
# Runs the end-to-end tests too: tests that bind a local socket for a fixture server.
# Without it, `cargo test` runs only the hermetic tests. No library code reads it.
e2e = []

[dependencies]
allowit-core = { workspace = true, features = ["std", "policy-source", "client", "transport", "vendor"] }
allowit-solana = { workspace = true }
allowit-stellar = { workspace = true, features = ["test-support"] }
base64 = "0.22"
getrandom = "0.3"
libc = "0.2.190"
serde = { version = "1.0.219", features = ["derive"] }
serde_json_canonicalizer = "0.3"
serde_json = { version = "1.0.143", features = ["raw_value", "arbitrary_precision"] }
zeroize = "1.8.2"
tempfile = "3.27"

chrono = { version = "0.4", default-features = false, features = ["std"] }
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

[[test]]
name = "rails"
required-features = ["testkit"]
