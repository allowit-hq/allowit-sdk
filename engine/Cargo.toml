[package]
name = "allowit-sdk-engine"
version.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Shared rail execution and owner workflows, with no terminal I/O"

[features]
default = ["stellar"]
stellar = ["dep:allowit-stellar-wallet"]

[dependencies]
allowit = { workspace = true }
allowit-sdk = { workspace = true, features = ["std", "policy-source", "client", "transport"] }
allowit-stellar-wallet = { workspace = true, optional = true }
getrandom = "0.3"
base64 = "0.22.1"
libc = "0.2.190"
serde = { version = "1.0.219", features = ["derive"] }
serde_json_canonicalizer = "0.3"
serde_json = { version = "1.0.143", features = ["raw_value", "arbitrary_precision"] }
sha2 = "0.10.9"
zeroize = "1.8.2"
tempfile = "3.27"
time = { version = "0.3.55", features = ["parsing", "formatting"] }

[dev-dependencies]
ed25519-dalek = "2"
stellar-strkey = "0.0.13"
stellar-xdr = { version = "=28.0.0", features = ["std", "base64"] }
