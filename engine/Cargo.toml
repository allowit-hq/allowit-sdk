[package]
name = "allowit-sdk-engine"
version.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Shared Stellar request and caller bindings, with no terminal I/O"

[dependencies]
allowit-sdk = { workspace = true, features = ["std", "typed-workflow", "client"] }
allowit-stellar-wallet.workspace = true
getrandom = "0.3"
ed25519-dalek = "2"
stellar-strkey = "0.0.13"
libc = "0.2.190"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["raw_value", "arbitrary_precision"] }
sha2 = "0.10.9"
zeroize = "1.8.2"
