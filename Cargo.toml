[workspace]
resolver = "3"
members = ["engine", "cli", "cli/templates/policy"]

# Every package in this repository releases at this version.
[workspace.package]
version = "0.4.0"
repository = "https://github.com/allowit-hq/allowit-sdk"

# Dependencies point one way: this SDK depends on Allowit core and on the rail
# crates, and the rail crates depend on Allowit core. Every crate in the build
# must name the same core release, so Cargo builds one copy of core.
[workspace.dependencies]
allowit-sdk = { git = "https://github.com/allowit-hq/allowit-core.git", tag = "v0.3.0", version = "0.3", default-features = false }
allowit-stellar-wallet = { git = "https://github.com/allowit-hq/allowit-contracts-stellar.git", tag = "v0.3.0", version = "0.3" }

# Every Allowit workspace uses this profile block, so a shared target directory
# builds each shared crate once. Release builds keep overflow checks, which the
# portable policy library requires, and the Soroban contract settings; the Wasm
# targets abort on panic by default.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
strip = "symbols"
