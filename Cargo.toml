[workspace]
resolver = "3"
members = ["engine", "cli", "cli/templates/policy"]

# Every package in this repository builds at this version.
[workspace.package]
version = "0.3.0"

# The revision each git repository must be pinned to. scripts/build.sh checks
# every git dependency against this table and fails on a stale pin.
[workspace.metadata.allowit.track]
allowit-core = "head"
# The Solana and Tempo host crates depend on allowit-core from these branches
# until allowit-contracts-solana#14 and allowit-contracts-tempo#8 merge.
# Then track "head" and run scripts/build.sh --update.
allowit-contracts-solana = { branch = "build-script-pins" }
allowit-contracts-tempo = { branch = "build-script-pins" }
# allowit-stellar-wallet exists only on stellar-core until that branch merges.
allowit-contracts-stellar = { branch = "stellar-core" }

# Pins point one way: this SDK depends on Allowit core and on the rail crates,
# and the rail crates depend on Allowit core.
[workspace.dependencies]
allowit-sdk = { git = "https://github.com/allowit-hq/allowit-core.git", rev = "e68ad4be5e4d1c28b8435982a2a208d2f872ba4e", default-features = false }
allowit-native = { git = "https://github.com/allowit-hq/allowit-contracts-solana.git", rev = "e1e24edfef1ddb0c9e7dd2b445797dabe6e1f318" }
allowit-solana-vendor = { git = "https://github.com/allowit-hq/allowit-contracts-solana.git", rev = "e1e24edfef1ddb0c9e7dd2b445797dabe6e1f318" }
allowit-solana-service-upstreams = { git = "https://github.com/allowit-hq/allowit-contracts-solana.git", rev = "e1e24edfef1ddb0c9e7dd2b445797dabe6e1f318" }
allowit-solana-service-rpc = { git = "https://github.com/allowit-hq/allowit-contracts-solana.git", rev = "e1e24edfef1ddb0c9e7dd2b445797dabe6e1f318" }
allowit-solana-delegated-x402 = { git = "https://github.com/allowit-hq/allowit-contracts-solana.git", rev = "e1e24edfef1ddb0c9e7dd2b445797dabe6e1f318" }
allowit-vendor-paysh-stock = { git = "https://github.com/allowit-hq/allowit-contracts-solana.git", rev = "e1e24edfef1ddb0c9e7dd2b445797dabe6e1f318" }
allowit-solana-paysh-cooperating = { git = "https://github.com/allowit-hq/allowit-contracts-solana.git", rev = "e1e24edfef1ddb0c9e7dd2b445797dabe6e1f318" }
allowit-tempo = { git = "https://github.com/allowit-hq/allowit-contracts-tempo.git", rev = "43519fe55549ceef69ba731027b63535c2b5a591" }
allowit-tempo-services = { git = "https://github.com/allowit-hq/allowit-contracts-tempo.git", rev = "43519fe55549ceef69ba731027b63535c2b5a591" }
allowit-stellar-wallet = { git = "https://github.com/allowit-hq/allowit-contracts-stellar.git", rev = "2415bff42c972281fd4648bdbdc44dcf3cfccf82" }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
