[workspace]
resolver = "3"
members = ["crates/allowit-sdk"]

# Every package in this repository releases at this version.
[workspace.package]
version = "0.5.0"
repository = "https://github.com/allowit-hq/allowit-sdk"

# Dependencies point one way: this SDK depends on Allowit core and on the rail
# crates, and the rail crates depend on Allowit core. Every crate in the build
# must name the same core release, so Cargo builds one copy of core.
[workspace.dependencies]
allowit = { git = "https://github.com/allowit-hq/allowit-core.git", tag = "v0.3.2", version = "0.3", default-features = false, features = ["std"] }
allowit-core = { package = "allowit-sdk", git = "https://github.com/allowit-hq/allowit-core.git", tag = "v0.3.2", version = "0.3", default-features = false }
allowit-stellar-wallet = { package = "allowit-stellar", git = "https://github.com/allowit-hq/allowit-contracts-stellar.git", rev = "2f685c20a8325d662ad8a3e9e81b01b7e6fc4d7c", version = "0.3" }

# Every Allowit workspace uses this profile block, so a shared target directory
# builds each shared crate once. Release builds keep overflow checks, which the
# portable policy library requires, and the Soroban contract settings; the Wasm
# targets abort on panic by default.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
strip = "symbols"
