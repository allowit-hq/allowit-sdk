[workspace]
resolver = "3"
members = ["crates/allowit-sdk"]

# Every package in this repository releases at this version.
[workspace.package]
version = "0.5.0"
repository = "https://github.com/allowit-hq/allowit-sdk"

# Dependencies point one way: this SDK depends on Allowit core and registers the rail plugins,
# and the rail crates depend on Allowit core. Every crate in the build must name the same core
# revision, so Cargo builds one copy of core and the plugin trait objects match.
[workspace.dependencies]
allowit-core = { git = "https://github.com/allowit-hq/allowit-core.git", rev = "22aa2b6b94b2cf9b1e34b0ea2e7c8b17d392c15b", default-features = false }
allowit-stellar = { git = "https://github.com/allowit-hq/allowit-contracts-stellar.git", rev = "c345ae2b1a378a096d7a37f59df34d600aaa1dcc" }

# Every Allowit workspace uses this profile block, so a shared target directory
# builds each shared crate once. Release builds keep overflow checks, which the
# portable policy library requires, and the vendor contract settings; the Wasm
# targets abort on panic by default.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
strip = "symbols"
