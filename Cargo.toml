[workspace]
resolver = "3"
members = ["engine", "cli", "cli/templates/policy"]

# Every package in this repository builds at this version.
[workspace.package]
version = "0.3.0"

# The revision each git repository must be pinned to. scripts/build.sh checks
# every git dependency against this table and fails on a stale pin.
[workspace.metadata.allowit.track]
# These branches carry the split until their pull requests merge: allowit-core
# cli-settings-overrides (the core part of #44), allowit-contracts-solana#14
# and allowit-contracts-tempo#8. Then track "head" and run
# scripts/build.sh --update allowit-core allowit-contracts-solana allowit-contracts-tempo.
allowit-core = { branch = "cli-settings-overrides" }
allowit-contracts-solana = { branch = "build-script-pins" }
allowit-contracts-tempo = { branch = "build-script-pins" }
# allowit-stellar-wallet exists only on stellar-core until that branch merges.
allowit-contracts-stellar = { branch = "stellar-core" }

# Pins point one way: this SDK depends on Allowit core and on the rail crates,
# and the rail crates depend on Allowit core.
[workspace.dependencies]
allowit-sdk = { git = "https://github.com/allowit-hq/allowit-core.git", rev = "897b1b4c16f3e5a4e8e7c5de082b41d2d600ff6e", default-features = false }
allowit-native = { git = "https://github.com/allowit-hq/allowit-contracts-solana.git", rev = "3686313db4f1e7048b86951ca4cc6f462d78cc9c" }
allowit-solana-service-upstreams = { git = "https://github.com/allowit-hq/allowit-contracts-solana.git", rev = "3686313db4f1e7048b86951ca4cc6f462d78cc9c" }
allowit-solana-service-rpc = { git = "https://github.com/allowit-hq/allowit-contracts-solana.git", rev = "3686313db4f1e7048b86951ca4cc6f462d78cc9c" }
allowit-solana-delegated-x402 = { git = "https://github.com/allowit-hq/allowit-contracts-solana.git", rev = "3686313db4f1e7048b86951ca4cc6f462d78cc9c" }
allowit-vendor-paysh-stock = { git = "https://github.com/allowit-hq/allowit-contracts-solana.git", rev = "3686313db4f1e7048b86951ca4cc6f462d78cc9c" }
allowit-solana-paysh-cooperating = { git = "https://github.com/allowit-hq/allowit-contracts-solana.git", rev = "3686313db4f1e7048b86951ca4cc6f462d78cc9c" }
allowit-tempo = { git = "https://github.com/allowit-hq/allowit-contracts-tempo.git", rev = "6a6ce3f6d5a0c1d8b6101f5dc441881e53c13d5b" }
allowit-tempo-services = { git = "https://github.com/allowit-hq/allowit-contracts-tempo.git", rev = "6a6ce3f6d5a0c1d8b6101f5dc441881e53c13d5b" }
allowit-stellar-wallet = { git = "https://github.com/allowit-hq/allowit-contracts-stellar.git", rev = "2415bff42c972281fd4648bdbdc44dcf3cfccf82" }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
