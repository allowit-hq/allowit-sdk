name: Private dependency access
description: >-
  Fetch locked Cargo sources, including the private dependency, with a read-only key that
  exists in one step only. Later steps build from the fetched sources and hold no key.
inputs:
  repository:
    description: Owner and name of the private dependency. Pass a secret, so the runner masks it.
    required: false
    default: ""
  ssh-key:
    description: Read-only deploy key for that repository. Pass a secret.
    required: false
    default: ""
  manifest-path:
    description: Cargo manifest whose locked sources this step fetches.
    required: false
    default: Cargo.toml
runs:
  using: composite
  steps:
    - name: Fetch private and locked sources with a step-scoped key
      shell: bash
      env:
        PRIVATE_DEPENDENCY_REPOSITORY: ${{ inputs.repository }}
        PRIVATE_DEPENDENCY_KEY: ${{ inputs.ssh-key }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
      run: bash "$GITHUB_ACTION_PATH/fetch.sh"
    - name: Confirm that the key is gone
      shell: bash
      env:
        PRIVATE_DEPENDENCY_REPOSITORY: ${{ inputs.repository }}
      run: bash "$GITHUB_ACTION_PATH/confirm-key-removed.sh"
