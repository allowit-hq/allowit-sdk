name: Focused CI
on:
  pull_request:
  push:
    branches: [main, prod]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focused-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
  vendor-boundary:
    name: Vendor boundary and npm registry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/vendor-boundary.mjs --self-test && node scripts/vendor-boundary.mjs
      - run: corepack enable && pnpm --dir npm install && pnpm --dir npm test
