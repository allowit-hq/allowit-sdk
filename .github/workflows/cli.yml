name: SDK engine
on:
  pull_request:
    paths:
      - ".github/actions/private-dependency/**"
      - "crates/allowit-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cli.yml"
  # The staging branch registers private packages. Its tests run on each push.
  push:
    branches: [staging]
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # No Rust cache in this job. This repository is public: a pull request from a fork can
      # restore caches of the base branch, and a cache of ~/.cargo/git or target/ would hold
      # private source and its build output.
      - name: Fetch private and locked sources
        uses: ./.github/actions/private-dependency
        with:
          repository: ${{ secrets.PRIVATE_DEPENDENCY_REPOSITORY }}
          ssh-key: ${{ secrets[vars.PRIVATE_DEPENDENCY_KEY_SECRET] }}
      - run: cargo fmt --all --check
      - run: cargo test --locked -p allowit-sdk@0.5.0 --features testkit
      - run: cargo clippy --locked -p allowit-sdk@0.5.0 --all-targets --features testkit -- -D warnings
